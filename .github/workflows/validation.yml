name: Autonomous validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch:
  schedule:
    # 06:30 KST, Monday-Friday (21:30 UTC, Sunday-Thursday)
    - cron: '30 21 * * 0-4'

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile Python entrypoints
        run: python -m py_compile market_data.py engine.py streamlit_app.py tools/live_validation.py tools/autonomous_scan.py tools/stress_confirm.py tools/paper_forward.py tools/promotion_gate.py tools/portfolio_gate.py tools/paper_broker.py
      - run: PYTHONPATH=. pytest -q

  market-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tools/live_validation.py

  autonomous-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-scan]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: apex-autonomous-scan-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full Korea + US 80-stock frozen validation
        run: PYTHONPATH=. python tools/autonomous_scan.py
      - name: Run immutable second-stage confirmation
        run: PYTHONPATH=. python tools/stress_confirm.py
      - name: Update frozen-admission forward paper tracker
        run: PYTHONPATH=. python tools/paper_forward.py
      - name: Apply frozen-admission promotion gate
        run: PYTHONPATH=. python tools/promotion_gate.py
      - name: Apply portfolio concentration gate
        run: PYTHONPATH=. python tools/portfolio_gate.py
      - name: Update autonomous shadow paper broker
        run: PYTHONPATH=. python tools/paper_broker.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-autonomous-validation
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Persist latest report on newest main
        if: success()
        run: |
          mkdir -p /tmp/apex-report
          cp -f reports/latest_validation.csv /tmp/apex-report/
          cp -f reports/latest_errors.json /tmp/apex-report/
          cp -f reports/latest_summary.md /tmp/apex-report/
          cp -f reports/latest_confirmation.csv /tmp/apex-report/
          cp -f reports/latest_confirmation.md /tmp/apex-report/
          cp -f reports/paper_state.json /tmp/apex-report/
          cp -f reports/paper_forward.csv /tmp/apex-report/
          cp -f reports/paper_forward.md /tmp/apex-report/
          cp -f reports/promotion_status.csv /tmp/apex-report/
          cp -f reports/promotion_status.md /tmp/apex-report/
          cp -f reports/portfolio_risk.csv /tmp/apex-report/
          cp -f reports/portfolio_risk.md /tmp/apex-report/
          cp -f reports/paper_broker_state.json /tmp/apex-report/
          cp -f reports/paper_account.csv /tmp/apex-report/
          cp -f reports/paper_positions.csv /tmp/apex-report/
          cp -f reports/paper_broker.md /tmp/apex-report/
          if [ -f reports/paper_orders.csv ]; then cp -f reports/paper_orders.csv /tmp/apex-report/; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports
          cp -f /tmp/apex-report/* reports/
          git add reports/latest_validation.csv reports/latest_errors.json reports/latest_summary.md reports/latest_confirmation.csv reports/latest_confirmation.md reports/paper_state.json reports/paper_forward.csv reports/paper_forward.md reports/promotion_status.csv reports/promotion_status.md reports/portfolio_risk.csv reports/portfolio_risk.md reports/paper_broker_state.json reports/paper_account.csv reports/paper_positions.csv reports/paper_broker.md
          if [ -f reports/paper_orders.csv ]; then git add reports/paper_orders.csv; fi
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: refresh v8.7 validation and shadow paper broker reports [skip ci]"
            git push origin HEAD:main
          fi

# v8.7: v8.6 validation + autonomous account-level shadow paper trading
