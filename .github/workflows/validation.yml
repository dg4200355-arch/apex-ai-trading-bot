name: Autonomous validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch:
  schedule:
    # 06:30 KST, Monday-Friday (21:30 UTC, Sunday-Thursday)
    - cron: '30 21 * * 0-4'

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile Python entrypoints
        run: python -m py_compile market_data.py engine.py streamlit_app.py tools/live_validation.py tools/autonomous_scan.py tools/stress_confirm.py tools/paper_forward.py tools/promotion_gate.py tools/portfolio_gate.py tools/paper_broker.py tools/paper_broker_raw.py tools/paper_broker_safe.py tools/broker_health.py
      - run: PYTHONPATH=. pytest -q

  market-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tools/live_validation.py

  autonomous-scan:
    needs: unit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-scan]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: apex-autonomous-scan-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full Korea + US 80-stock frozen validation
        run: PYTHONPATH=. python tools/autonomous_scan.py
      - name: Run immutable second-stage confirmation
        run: PYTHONPATH=. python tools/stress_confirm.py
      - name: Replay forward bars and reconcile verification after cutoff
        run: PYTHONPATH=. python tools/paper_forward.py
      - name: Apply frozen-admission promotion gate
        run: PYTHONPATH=. python tools/promotion_gate.py
      - name: Apply portfolio concentration gate
        run: PYTHONPATH=. python tools/portfolio_gate.py
      - name: Update transactional raw-execution shadow paper broker
        run: PYTHONPATH=. python tools/paper_broker_safe.py
      - name: Validate raw broker accounting and risk invariants
        run: PYTHONPATH=. python tools/broker_health.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-autonomous-validation
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Persist latest known-good reports
        if: success()
        run: |
          mkdir -p /tmp/apex-report
          cp -f reports/latest_validation.csv /tmp/apex-report/
          cp -f reports/latest_errors.json /tmp/apex-report/
          cp -f reports/latest_summary.md /tmp/apex-report/
          cp -f reports/latest_confirmation.csv /tmp/apex-report/
          cp -f reports/latest_confirmation.md /tmp/apex-report/
          cp -f reports/paper_state.json /tmp/apex-report/
          cp -f reports/paper_forward.csv /tmp/apex-report/
          cp -f reports/paper_forward.md /tmp/apex-report/
          cp -f reports/promotion_status.csv /tmp/apex-report/
          cp -f reports/promotion_status.md /tmp/apex-report/
          cp -f reports/portfolio_risk.csv /tmp/apex-report/
          cp -f reports/portfolio_risk.md /tmp/apex-report/
          cp -f reports/paper_broker_state.json /tmp/apex-report/
          cp -f reports/paper_account.csv /tmp/apex-report/
          cp -f reports/paper_positions.csv /tmp/apex-report/
          cp -f reports/paper_broker.md /tmp/apex-report/
          cp -f reports/paper_broker_health.json /tmp/apex-report/
          cp -f reports/paper_broker_health.md /tmp/apex-report/
          if [ -f reports/paper_orders.csv ]; then cp -f reports/paper_orders.csv /tmp/apex-report/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports
          cp -f /tmp/apex-report/* reports/
          git add reports/latest_validation.csv reports/latest_errors.json reports/latest_summary.md reports/latest_confirmation.csv reports/latest_confirmation.md reports/paper_state.json reports/paper_forward.csv reports/paper_forward.md reports/promotion_status.csv reports/promotion_status.md reports/portfolio_risk.csv reports/portfolio_risk.md reports/paper_broker_state.json reports/paper_account.csv reports/paper_positions.csv reports/paper_broker.md reports/paper_broker_health.json reports/paper_broker_health.md
          if [ -f reports/paper_orders.csv ]; then git add reports/paper_orders.csv; fi
          if git diff --cached --quiet; then
            echo "No known-good report changes"
          else
            git commit -m "chore: refresh v9.1 raw-execution validation and paper reports [skip ci]"
            git push origin HEAD:main
          fi
      - name: Persist FULL80 heartbeat and fail-closed diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p /tmp/apex-status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
              "pipeline": "FULL80",
              "status": os.environ.get("JOB_STATUS", "unknown"),
              "at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "run_id": os.environ.get("RUN_ID"),
              "trigger_sha": os.environ.get("TRIGGER_SHA"),
              "event": os.environ.get("EVENT_NAME"),
          }
          Path("/tmp/apex-status/full_pipeline_status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          for f in failed_scan_errors.json failed_confirmation_errors.json failed_paper_broker.json; do
            if [ -f "reports/$f" ]; then cp -f "reports/$f" "/tmp/apex-status/$f"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports
          cp -f /tmp/apex-status/full_pipeline_status.json reports/
          if [ "$JOB_STATUS" = "success" ]; then
            git rm -f --ignore-unmatch reports/failed_scan_errors.json reports/failed_confirmation_errors.json reports/failed_paper_broker.json || true
          else
            for f in failed_scan_errors.json failed_confirmation_errors.json failed_paper_broker.json; do
              if [ -f "/tmp/apex-status/$f" ]; then cp -f "/tmp/apex-status/$f" "reports/$f"; fi
            done
          fi
          git add reports/full_pipeline_status.json
          for f in reports/failed_scan_errors.json reports/failed_confirmation_errors.json reports/failed_paper_broker.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No pipeline-status changes"
          else
            git commit -m "chore: persist FULL80 pipeline status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# v9.1.3: known-good reports + always-persisted FULL80 heartbeat/fail-closed diagnostics
